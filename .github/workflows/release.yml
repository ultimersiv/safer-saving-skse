name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check tag matches xmake.lua version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $match = Select-String -Path xmake.lua -Pattern 'set_version\("([^"]+)"\)' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $version) { throw "tag v$tag does not match set_version(`"$version`") in xmake.lua" }
          "tag v$tag matches xmake.lua"

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true
          package-cache: true

      - name: Update xmake package repo
        run: xmake repo --update

      - name: Configure
        run: xmake config -m releasedbg -a x64 --yes

      - name: Build
        run: xmake build --yes

      - name: Package
        run: xmake package --yes

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaferSaving-package
          path: build/packages/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem build/packages/*.zip | Select-Object -First 1
          if (-not $zip) { throw "no archive produced" }
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title $env:GITHUB_REF_NAME --generate-notes
