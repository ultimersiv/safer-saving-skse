; Safer Saving
;
; Do not edit this file. It is overwritten when the mod updates.
; Copy the lines you want to change into SaferSaving_custom.ini in this same
; folder and edit them there. Anything you leave out keeps the value below.

[Load]
; Seconds to refuse saving after a loading screen, after loading a save, and
; after starting a new game. This is when script load is heaviest. Set to 0 to
; disable the wait.
iSettleSeconds = 30

[AutoSave]
; Minutes of play between automatic saves. Only time the game is actually
; running counts: the timer does not tick while paused, in a menu that pauses
; the game, or on a loading screen, and time scaling does not speed it up or
; slow it down. If the interval runs out while saving is blocked, the save is
; not skipped: it waits and happens at the next safe moment, however long that
; takes. Set to 0 to turn automatic saving off.
iIntervalMinutes = 15
; How many slots to rotate through. They show in the load menu as autosaves of
; the current character, in slots 1001 upwards, so vanilla autosaves in slots
; 1 to 3 and your own saves are never touched. Lowering this leaves the extra
; files behind for you to delete.
; Skyrim also keeps a .bak copy of each save it overwrites, so expect about twice
; this many files on disk.
iSlots = 5

[Combat]
bInCombat = true
; Mid-swing, bow draws, bashes and spellcasting.
bAttacking = true
; Weapon or spell out, including the draw and sheathe animations.
bWeaponDrawn = true
bKillmove = true

[Movement]
bMoving = true
bSprinting = true
bSneaking = true
bSwimming = true
bFlying = true
; Jumping or falling.
bMidair = true
bMounted = true

[State]
; Dead, dying or unconscious.
bNotAlive = true
bBleedingOut = true
bKnockedDown = true
bStaggered = true
; Sitting down, standing up, getting in or out of a bed.
bSitSleepTransition = true
; Paired and scripted animations. This also covers furniture idles, so leaving
; it on means you cannot save while seated.
bAnimationDriven = true
; Holding an object with grab or telekinesis.
bGrabbing = true
; Scripted scenes and anything else that takes your controls away.
bControlsDisabled = true
; Before your surroundings have finished loading in.
b3DNotLoaded = true

[Menus]
; Inventory, container, barter, gift, magic, favourites and the pause wheel.
bItemMenus = true
bDialogue = true
bBook = true
bCrafting = true
bLockpicking = true
bLevelUpTraining = true
bSleepWait = true
bLoading = true
bCharacterCreation = true
