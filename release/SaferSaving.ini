; Safer Saving
;
; Do not edit this file. It is overwritten when the mod updates.
; Copy the lines you want to change into SaferSaving_custom.ini in this same
; folder and edit them there. Anything you leave out keeps the value below.

[Notification]
; Show a message in the corner explaining why saving is blocked when you press
; the quicksave key. Autosaves and saves made by scripts stay silent.
bEnabled = true
; Text put in front of the reason. A space is added for you, and any you put at
; the start or end is dropped. Leave it blank for the reason on its own.
sPrefix = Cannot save:

[Load]
; Seconds to refuse saving after a loading screen, after loading a save, and
; after starting a new game. This is when script load is heaviest. Set to 0 to
; disable the wait.
iSettleSeconds = 30

[Autosave]
; Turn off every save the game makes on its own: on pause, on fast travel, on
; waiting, on resting, and the ones quests and mods ask for through scripts.
; The timed save below replaces them. Set to false to leave the game to its
; usual autosaves.
; Four of these switches live in SkyrimPrefs.ini, which the game writes back, so
; turning this off again may not restore them. Vanilla has all four on, if you
; need to put them back by hand.
bDisableVanilla = true
; Minutes of play between automatic saves. Only time the game is actually
; running counts: the timer does not tick while paused, in a menu that pauses
; the game, or on a loading screen. If the interval runs out while saving is
; blocked, the save is not skipped: it waits and happens at the next safe
; moment, however long that takes. Any save you make yourself restarts it.
; Set to 0 to turn automatic saving off.
iIntervalMinutes = 15
; How many slots to rotate through. They show in the load menu as autosaves of
; the current character, numbered from 101, so vanilla autosaves and your own
; saves are never touched. The file sitting in a slot is deleted as that slot
; comes round again, which is what keeps the count down. Lowering this leaves
; the extra files behind for you to delete yourself.
iSlots = 5

[Saves]
; Keep at most this many manual saves for the character you are playing. Each time
; you make a manual save the oldest beyond this count go to the Recycle Bin, with
; their co-saves, so a cull you did not want can be undone from there. Quicksaves,
; autosaves and other characters are never touched. Turning this on with a folder
; already over the count culls it down at your next manual save. Set to 0, the
; default, to keep every save.
iMaxManualSaves = 0

[Combat]
bInCombat = true
; Mid-swing, bow draws, bashes and spellcasting.
bAttacking = true
; Weapon or spell out, including the draw and sheathe animations.
bWeaponDrawn = true
bKillmove = true
; Hostile actors close by, the same test vanilla uses before it lets you wait or fast travel. Trips
; slightly earlier than bInCombat, when something has noticed you but has not engaged yet.
bEnemiesNearby = true

[Movement]
bMoving = true
bSprinting = true
bSneaking = true
bSwimming = true
bFlying = true
; Jumping or falling.
bMidair = true
bMounted = true

[State]
; Dead, dying or unconscious.
bNotAlive = true
bBleedingOut = true
bKnockedDown = true
bStaggered = true
; Sitting down, standing up, getting in or out of a bed.
bSitSleepTransition = true
; Paired and scripted animations. This also covers furniture idles, so leaving
; it on means you cannot save while seated.
bAnimationDriven = true
; Holding an object with grab or telekinesis.
bGrabbing = true
; Scripted scenes and anything else that takes your controls away.
bControlsDisabled = true
; Standing somewhere you are not allowed to be.
bTrespassing = true
; Before your surroundings have finished loading in.
b3DNotLoaded = true

[Menus]
; Inventory, container, barter, gift, magic, favourites and the pause wheel.
bItemMenus = true
bDialogue = true
bBook = true
bCrafting = true
bLockpicking = true
bLevelUpTraining = true
bSleepWait = true
bLoading = true
bCharacterCreation = true
